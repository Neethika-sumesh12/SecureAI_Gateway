server.port=8080
spring.application.name=secureai-gateway

# Gateway Configuration defaults
secureai.gateway.default-mode=BALANCED
secureai.llm.provider=MOCK
# Optional: Set Ollama endpoint if running locally:
secureai.llm.ollama.url=http://localhost:11434/api/generate
secureai.llm.ollama.model=llama3

# Compression stage (Balanced-mode rule). Defaults match the measured results in the README.
# Balanced skips compression below min-tokens (SKIPPED_SMALL) and validates only when savings exceed
# aggressive-savings-percent or the format is not recognized.
secureai.compression.min-tokens=500
secureai.compression.aggressive-savings-percent=80.0
